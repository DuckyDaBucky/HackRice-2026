name: presage-edge

# Dedicated edge deployment for the Presage API on root@dev (Ubuntu LXC guest).
# Public ingress arrives via the cloudflared sidecar (Cloudflare Tunnel
# presage-dev -> presage.getmehired.today). The origin port is never published
# beyond loopback. See README.md and docs/22-presage-proxmox-cloudflare-deployment.md.

services:
  presage-api:
    build:
      context: ../../presage-api
      dockerfile: Dockerfile
    hostname: presage-api
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    expose:
      - "8080"
    ports:
      # Loopback only: host-local diagnostics. Never bind 0.0.0.0:8080.
      - "127.0.0.1:8080:8080"
    volumes:
      # Persistent SmartSpectra device identity. Never delete this volume
      # (no `docker compose down -v`) or the SDK re-pairs as a new device.
      - presage-keyring:/home/node/.local/share/keyrings
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  cloudflared:
    # Pinned: do not use `latest`. Re-pin deliberately and record the digest.
    image: cloudflare/cloudflared:2026.7.3
    restart: unless-stopped
    depends_on:
      presage-api:
        condition: service_healthy
    # Remotely managed tunnel: hostname presage.getmehired.today -> http://presage-api:8080
    # is configured in the Cloudflare Zero Trust dashboard, not here.
    # Token mechanism: cloudflared 2026.7.3 rejects token-file, and the image
    # contains no shell for a file-to-env wrapper, so the connector reads the
    # documented TUNNEL_TOKEN variable from a mode-0600 host file. Never run
    # plain compose config here (it would print the token);
    # config --quiet is the only sanctioned render check.
    env_file:
      - ./secrets/cloudflared-token.env
    command: ["tunnel", "--no-autoupdate", "run"]

volumes:
  presage-keyring:
